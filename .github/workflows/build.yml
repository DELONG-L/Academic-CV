name: Build and check CV template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install TeX Live 2026
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          texlive_version: 2026
          package_file: texlive-packages.txt
          accept-stale: false
      - name: Install Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv
      - name: Build and check
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install -r requirements-qa.txt
          python3 scripts/build.py
          python3 scripts/check.py
          python3 scripts/smoke.py
          python3 scripts/pack.py
      - name: Save template package and PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cv-template
          path: |
            dist/academic-cv.zip
            dist/cv.pdf
            dist/cv-zh.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: cv
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download checked package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cv-template
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Academic CV $RELEASE_TAG" \
            --notes-file .github/release-notes.md \
            dist/academic-cv.zip dist/cv.pdf dist/cv-zh.pdf
          gh release edit "$RELEASE_TAG" --draft=false --latest
