name: Build and check CV template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install TeX and Python tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-chinese texlive-bibtex-extra fonts-texgyre biber latexmk python3-venv
      - name: Build and check
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install -r requirements-qa.txt
          python3 scripts/build.py
          python3 scripts/check.py
          python3 scripts/smoke.py
      - name: Save PDFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cv-pdfs
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
